name: Foundation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14.7"
  UV_VERSION: "0.12.19"
  NODE_VERSION: "24.21.0"
  PNPM_VERSION: "12.5.1"
  GITLEAKS_VERSION: "8.30.1"

jobs:
  python:
    name: Python quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install pinned uv and Python
        run: |
          mkdir -p .tools/downloads .tools/uv-${UV_VERSION}
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output .tools/downloads/uv.tar.gz \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output .tools/downloads/uv.tar.gz.sha256 \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz.sha256"
          sed 's/  uv-x86_64-unknown-linux-gnu.tar.gz$/  uv.tar.gz/' \
            .tools/downloads/uv.tar.gz.sha256 | \
            (cd .tools/downloads && sha256sum --check -)
          tar --extract --gzip --file .tools/downloads/uv.tar.gz \
            --directory ".tools/uv-${UV_VERSION}" --strip-components=1
          test "$(.tools/uv-${UV_VERSION}/uv --version)" = "uv ${UV_VERSION} (x86_64-unknown-linux-gnu)"
          ".tools/uv-${UV_VERSION}/uv" python install "${PYTHON_VERSION}"

      - name: Frozen Python install
        run: make sync

      - name: Python format
        run: make format-check

      - name: Python lint
        run: make lint

      - name: Python types
        run: make type-check

      - name: Python tests
        run: make unit-test

      - name: Audit locked Python dependencies
        run: |
          .tools/uv-${UV_VERSION}/uv export --frozen --all-packages \
            --no-dev --no-emit-workspace --format requirements-txt \
            --output-file /tmp/documentz-requirements.txt
          .tools/uv-${UV_VERSION}/uvx --from pip-audit==2.10.1 \
            pip-audit --strict --requirement /tmp/documentz-requirements.txt

  portal:
    name: Portal quality, tests, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install pinned Node and pnpm
        run: |
          mkdir -p .tools/downloads ".tools/node-v${NODE_VERSION}"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output .tools/downloads/node.tar.xz \
            "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output .tools/downloads/node-SHASUMS256.txt \
            "https://nodejs.org/dist/v${NODE_VERSION}/SHASUMS256.txt"
          grep "  node-v${NODE_VERSION}-linux-x64.tar.xz$" \
            .tools/downloads/node-SHASUMS256.txt | \
            sed "s/  node-v${NODE_VERSION}-linux-x64.tar.xz$/  node.tar.xz/" | \
            (cd .tools/downloads && sha256sum --check -)
          tar --extract --file .tools/downloads/node.tar.xz \
            --directory ".tools/node-v${NODE_VERSION}" --strip-components=1
          export PATH="$GITHUB_WORKSPACE/.tools/node-v${NODE_VERSION}/bin:$PATH"
          echo "$GITHUB_WORKSPACE/.tools/node-v${NODE_VERSION}/bin" >> "$GITHUB_PATH"
          node --version | grep --fixed-strings --line-regexp "v${NODE_VERSION}"
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: Frozen Portal install
        run: |
          pnpm --version | grep --fixed-strings --line-regexp "${PNPM_VERSION}"
          pnpm install --frozen-lockfile

      - name: Portal format
        run: pnpm format-check

      - name: Portal lint
        run: pnpm lint

      - name: Portal types
        run: pnpm type-check

      - name: Portal component tests
        run: pnpm portal-test

      - name: Portal production build
        run: pnpm portal-build

      - name: Audit locked Portal dependencies
        run: pnpm audit --audit-level high

  postgres:
    name: PostgreSQL and pgvector migration smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: documentz-ci-${{ github.run_id }}-${{ github.run_attempt }}
      DOCUMENTZ_DEV_POSTGRES_PASSWORD_FILE: /tmp/documentz-development-password
      DOCUMENTZ_TEST_POSTGRES_PASSWORD_FILE: /tmp/documentz-test-password
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install pinned uv and Python
        run: |
          mkdir -p .tools/downloads .tools/uv-${UV_VERSION}
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output .tools/downloads/uv.tar.gz \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output .tools/downloads/uv.tar.gz.sha256 \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz.sha256"
          sed 's/  uv-x86_64-unknown-linux-gnu.tar.gz$/  uv.tar.gz/' \
            .tools/downloads/uv.tar.gz.sha256 | \
            (cd .tools/downloads && sha256sum --check -)
          tar --extract --gzip --file .tools/downloads/uv.tar.gz \
            --directory ".tools/uv-${UV_VERSION}" --strip-components=1
          test "$(.tools/uv-${UV_VERSION}/uv --version)" = "uv ${UV_VERSION} (x86_64-unknown-linux-gnu)"
          ".tools/uv-${UV_VERSION}/uv" python install "${PYTHON_VERSION}"
          make sync

      - name: Generate ephemeral database passwords
        run: |
          umask 077
          openssl rand -base64 32 > "${DOCUMENTZ_DEV_POSTGRES_PASSWORD_FILE}"
          openssl rand -base64 32 > "${DOCUMENTZ_TEST_POSTGRES_PASSWORD_FILE}"

      - name: Development database migration
        run: scripts/postgres_pgvector_smoke.sh development

      - name: Test database migration
        run: scripts/postgres_pgvector_smoke.sh test

      - name: Remove database resources and secrets
        if: always()
        run: |
          docker compose --profile development --profile test down --volumes --remove-orphans
          for password_file in \
            "${DOCUMENTZ_DEV_POSTGRES_PASSWORD_FILE}" \
            "${DOCUMENTZ_TEST_POSTGRES_PASSWORD_FILE}"
          do
            if [ -f "${password_file}" ]; then
              rm -- "${password_file}"
            fi
          done

  secrets:
    name: Repository secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-verified gitleaks
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output /tmp/gitleaks-checksums.txt \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "  gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz$" \
            /tmp/gitleaks-checksums.txt | \
            (cd /tmp && sha256sum --check -)
          tar --extract --gzip --file /tmp/gitleaks.tar.gz --directory /tmp gitleaks
          /tmp/gitleaks version | grep --fixed-strings "${GITLEAKS_VERSION}"

      - name: Scan Git history for secrets
        run: /tmp/gitleaks git --redact --no-banner --exit-code 1 .
