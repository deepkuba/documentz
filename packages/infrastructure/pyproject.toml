[project]
name = "documentz-infrastructure"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
    "SQLAlchemy==2.1.1",
    "alembic==1.20.0",
    "documentz-application",
    "documentz-domain",
    "procrastinate==3.10.0",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.uv.sources]
documentz-application = { workspace = true }
documentz-domain = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/documentz_infrastructure"]
