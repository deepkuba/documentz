[project]
name = "documentz-application"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = ["documentz-domain"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.uv.sources]
documentz-domain = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/documentz_application"]
